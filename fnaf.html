<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIVE NIGHTS AT FREDDY'S - UNBLEEKED</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link class="favicon" rel="icon" href="img/FirstAvatar.png">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        } 
        
        :root { 
            --bg: #070707; 
            --bg-soft: #0d0d0d; 
            --card: rgba(18, 18, 18, 0.72); 
            --card-hover: rgba(25, 25, 25, 0.9); 
            --border: rgba(255, 255, 255, 0.09); 
            --border-hover: rgba(255, 255, 255, 0.28); 
            --text: #ffffff; 
            --muted: rgba(255, 255, 255, 0.55); 
        } 

        body { 
            font-family: "Orbitron", monospace; 
            background: radial-gradient(circle at 15% 20%, rgba(255,255,255,0.035), transparent 30%), radial-gradient(circle at 85% 75%, rgba(255,255,255,0.025), transparent 30%), #070707; 
            color: var(--text); 
            min-height: 100vh; 
            overflow-x: hidden; 
        } 

        /* Subtle background grid */ 
        body::before { 
            content: ""; 
            position: fixed; 
            inset: 0; 
            z-index: 0; 
            pointer-events: none; 
            opacity: 0.18; 
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); 
            background-size: 45px 45px; 
            mask-image: linear-gradient(to bottom, black, transparent 85%); 
            -webkit-mask-image: linear-gradient(to bottom, black, transparent 85%);
        } 

        /* BACKGROUND */ 
        .background { 
            position: fixed; 
            inset: 0; 
            z-index: 0; 
            pointer-events: none; 
            overflow: hidden; 
        } 

        .glow-ring { 
            position: absolute; 
            border-radius: 50%; 
            filter: blur(120px); 
        } 

        .glow-1 { 
            top: 5%; 
            left: 5%; 
            width: 350px; 
            height: 350px; 
            background: rgba(255,255,255,0.025); 
            animation: floatOne 14s ease-in-out infinite; 
        } 

        .glow-2 { 
            bottom: 5%; 
            right: 5%; 
            width: 400px; 
            height: 400px; 
            background: rgba(255,255,255,0.02); 
            animation: floatTwo 18s ease-in-out infinite; 
        } 

        .glow-3 { 
            top: 45%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 700px; 
            height: 700px; 
            background: rgba(255,255,255,0.012); 
            filter: blur(150px); 
        } 

        @keyframes floatOne { 
            0%, 100% { transform: translate(0, 0); } 
            50% { transform: translate(45px, -30px); } 
        } 

        @keyframes floatTwo { 
            0%, 100% { transform: translate(0, 0); } 
            50% { transform: translate(-35px, 30px); } 
        } 

        /* LAYOUT */ 
        .container { 
            position: relative; 
            z-index: 5; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px; 
        } 

        /* HEADER */ 
        .header { 
            text-align: center; 
            padding: 42px 0 30px; 
        } 

        .back-btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 9px; 
            padding: 12px 18px; 
            margin-bottom: 30px; 
            background: rgba(255,255,255,0.035); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            color: #fff; 
            text-decoration: none; 
            font-family: "Orbitron", monospace; 
            font-size: 12px; 
            font-weight: 600; 
            letter-spacing: 0.04em; 
            backdrop-filter: blur(12px); 
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease; 
        } 

        .back-btn:hover { 
            background: rgba(255,255,255,0.08); 
            border-color: var(--border-hover); 
            transform: translateY(-2px); 
        } 

        .back-btn svg { 
            opacity: 0.75; 
        } 

        /* TITLE */ 
        .title { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 76px; 
            font-family: "Orbitron", monospace; 
            font-size: clamp(2rem, 5vw, 3.5rem); 
            font-weight: 900; 
            letter-spacing: 0.15em; 
            color: #fff; 
            cursor: pointer; 
            user-select: none; 
            text-shadow: 0 0 18px rgba(255,255,255,0.12); 
            animation: titlePulse 3s ease-in-out infinite alternate; 
            margin-bottom: 2rem;
            flex-wrap: wrap;
        } 

        .cursor { 
            margin-left: 5px; 
            font-weight: 400; 
            color: #fff;
            animation: cursorBlink 0.9s infinite; 
        } 

        @keyframes titlePulse { 
            from { text-shadow: 0 0 12px rgba(255,255,255,0.08); } 
            to { text-shadow: 0 0 20px rgba(255,255,255,0.18), 0 0 45px rgba(255,255,255,0.07); } 
        } 

        @keyframes cursorBlink { 
            0%, 45% { opacity: 1; } 
            46%, 100% { opacity: 0; } 
        } 

        /* CONTROLS */ 
        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            margin: 12px 0 34px; 
            flex-wrap: wrap; 
        } 

        .search-container { 
            position: relative; 
        } 

        .search-input { 
            width: 320px; 
            height: 48px; 
            padding: 0 16px 0 46px; 
            background: rgba(255,255,255,0.035); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            color: #fff; 
            font-family: "Orbitron", monospace; 
            font-size: 12px; 
            font-weight: 500; 
            outline: none; 
            backdrop-filter: blur(12px); 
            transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease; 
        } 

        .search-input::placeholder { 
            color: rgba(255,255,255,0.35); 
        } 

        .search-input:focus { 
            background: rgba(255,255,255,0.055); 
            border-color: rgba(255,255,255,0.28); 
            box-shadow: 0 0 25px rgba(255,255,255,0.045); 
        } 

        .search-icon { 
            position: absolute; 
            left: 16px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: rgba(255,255,255,0.42); 
            pointer-events: none; 
        } 

        .select-container { 
            position: relative; 
        } 

        .select { 
            height: 48px; 
            min-width: 180px; 
            padding: 0 38px 0 15px; 
            background: rgba(255,255,255,0.035); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            color: #fff; 
            font-family: "Orbitron", monospace; 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            outline: none; 
            appearance: none; 
            backdrop-filter: blur(12px); 
            transition: border-color 0.25s ease, background 0.25s ease; 
        } 

        .select:hover { 
            background: rgba(255,255,255,0.055); 
            border-color: rgba(255,255,255,0.18); 
        } 

        .select:focus { 
            border-color: rgba(255,255,255,0.28); 
            box-shadow: 0 0 25px rgba(255,255,255,0.045); 
        } 

        .select option { 
            background: #101010; 
            color: #fff; 
        } 

        /* GRID */ 
        .games-grid { 
            display: grid; 
            gap: 18px; 
            margin-bottom: 65px; 
            transition: all 0.3s cubic-bezier(.2,.8,.2,1); 
        } 

        .grid-mobile { grid-template-columns: 1fr !important; } 
        .grid-tablet { grid-template-columns: repeat(2, 1fr) !important; } 
        .grid-desktop { grid-template-columns: repeat(3, 1fr) !important; } 

        /* CARDS */ 
        .game-card { 
            position: relative; 
            cursor: pointer; 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            overflow: hidden; 
            backdrop-filter: blur(14px); 
            -webkit-backdrop-filter: blur(14px); 
            transition: transform 0.3s cubic-bezier(.2,.8,.2,1), border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease; 
        } 

        .game-card::before { 
            content: ""; 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 1px; 
            background: linear-gradient( 90deg, transparent, rgba(255,255,255,0.18), transparent ); 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            z-index: 4; 
        } 

        .game-card:hover { 
            transform: translateY(-8px); 
            background: var(--card-hover); 
            border-color: var(--border-hover); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 20px rgba(255,255,255,0.02); 
        } 

        .game-card:hover::before { 
            opacity: 1; 
        } 

        .img-container { 
            width: 100%; 
            height: 190px; 
            background: #0a0a0a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            overflow: hidden; 
        } 

        .img-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 2; 
            transition: transform 0.5s cubic-bezier(.2,.8,.2,1); 
        } 

        .game-card:hover .img-container img { 
            transform: scale(1.05); 
        } 

        .img-container::after { 
            content: "📂"; 
            font-size: 42px; 
            opacity: 0.08; 
            position: absolute; 
            z-index: 1; 
        } 

        .game-name { 
            padding: 1.1rem; 
            border-top: 1px solid var(--border); 
            height: 64px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: var(--text); 
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
            background: rgba(10, 10, 10, 0.4); 
            transition: background 0.3s ease; 
        } 

        .game-card:hover .game-name { 
            background: rgba(20, 20, 20, 0.6); 
        } 

        /* FOOTER */ 
        .footer { 
            text-align: center; 
            padding: 3rem 0; 
            border-top: 1px solid var(--border); 
            margin-top: 4rem; 
        } 

        .footer-links { 
            display: flex; 
            justify-content: center; 
            gap: 2.5rem; 
            flex-wrap: wrap; 
        } 

        .footer-link { 
            color: var(--muted); 
            text-decoration: none; 
            position: relative; 
            font-size: 0.8rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            transition: color 0.25s ease, text-shadow 0.25s ease; 
        } 

        .footer-link::after { 
            content: ''; 
            position: absolute; 
            width: 100%; 
            height: 1px; 
            bottom: -4px; 
            left: 0; 
            background-color: var(--border-hover); 
            transform: scaleX(0); 
            transform-origin: bottom right; 
            transition: transform 0.3s ease; 
        } 

        .footer-link:hover::after { 
            transform: scaleX(1); 
            transform-origin: bottom left; 
        } 

        .footer-link:hover { 
            color: #fff; 
            text-shadow: 0 0 8px rgba(255,255,255,0.3); 
        } 

        /* RESPONSIVE */ 
        @media (max-width: 768px) { 
            .title { font-size: 1.8rem; letter-spacing: 0.1em; } 
            .search-input { width: 100%; } 
            .controls { gap: 12px; flex-direction: column; align-items: center; } 
            .select-container, .search-container { width: 100%; max-width: 320px; } 
            .select { width: 100%; } 
            .footer-links { gap: 1.5rem; } 
        } 
    </style>
</head>
<body>
    <div class="background">

        <div class="glow-ring glow-3"></div>
    </div>

    <div class="container">

                <div class="game-card" data-category="pc">

        <footer class="footer">

                <a href="#" class="footer-link" onclick="openBlank(); return false;">open blank</a>

    <script>
        // Typewriter Effect
        const words = ["FIVE NIGHTS AT FREDDY'S"];
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typewriter').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 3000);
                    return false;
                }
                timer = setTimeout(loopTyping, 100);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typewriter').innerHTML = word.join("");
                } else {
                    i = (i + 1) % words.length;
                    setTimeout(typingEffect, 500);
                    return false;
                }
                timer = setTimeout(loopDeleting, 50);
            };
            loopDeleting();
        }

        // Title Navigation Click
        document.getElementById('titleContainer').addEventListener('click', () => {
            window.location.href = '/index.html';
        });

        // Search and Filter Functionality
        const searchInput = document.getElementById('searchInput');
        const categorySelect = document.getElementById('categorySelect');
        const gamesGrid = document.getElementById('gamesGrid');
        const gameCards = document.querySelectorAll('.game-card');

        function filterGames() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const selectedCategory = categorySelect.value;

            gameCards.forEach(card => {
                const gameName = card.querySelector('.game-name').textContent.toLowerCase();
                const gameCategory = card.getAttribute('data-category');

                const matchesSearch = gameName.includes(searchTerm);
                const matchesCategory = selectedCategory === 'all' || gameCategory === selectedCategory;

                if (matchesSearch && matchesCategory) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        searchInput.addEventListener('input', filterGames);
        categorySelect.addEventListener('change', filterGames);

        // Grid Layout Customizer
        const gridSelect = document.getElementById('gridSelect');
        gridSelect.addEventListener('change', () => {
            const val = gridSelect.value;
            gamesGrid.classList.remove('grid-mobile', 'grid-tablet', 'grid-desktop');
            
            if (val === 'mobile') {
                gamesGrid.classList.add('grid-mobile');
            } else if (val === 'tablet') {
                gamesGrid.classList.add('grid-tablet');
            } else if (val === 'desktop') {
                gamesGrid.classList.add('grid-desktop');
            } else {
                updateAutoGrid();
            }
        });

        function updateAutoGrid() {
            if (gridSelect.value !== 'auto') return;
            gamesGrid.classList.remove('grid-mobile', 'grid-tablet', 'grid-desktop');
            if (window.innerWidth <= 480) {
                gamesGrid.classList.add('grid-mobile');
            } else if (window.innerWidth <= 768) {
                gamesGrid.classList.add('grid-tablet');
            } else {
                gamesGrid.classList.add('grid-desktop');
            }
        }

        window.addEventListener('resize', updateAutoGrid);

        // Open Blank utility function
        function openBlank() {
            window.open('about:blank', '_blank');
        }

        // Initialize script behaviors
        window.onload = function() {
            typingEffect();
            updateAutoGrid();
        };
    </script>
</body>
