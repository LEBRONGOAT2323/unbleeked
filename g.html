<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMES | UNBLEEKED</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Orbitron', monospace;
    background: linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#111);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

@keyframes gradient {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* BACKGROUND */
.background {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.glow-ring {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
}

.glow-1 {
    top: 20%;
    left: 20%;
    width: 400px;
    height: 400px;
    background: rgba(0,123,255,0.15);
}

.glow-2 {
    bottom: 20%;
    right: 20%;
    width: 400px;
    height: 400px;
    background: rgba(255,255,255,0.05);
}

/* LAYOUT */
.container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* HEADER */
.title {
    text-align: center;
    font-size: 3rem;
    font-weight: 900;
    margin-bottom: 20px;
    text-shadow: 0 0 20px rgba(0,123,255,0.6);
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.search-input, .select {
    padding: 12px 15px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3);
    color: white;
    font-family: Orbitron;
}

.search-input {
    width: 250px;
}

/* GRID */
.games-grid {
    display: grid;
    gap: 15px;
    transition: 0.3s;
}

.grid-mobile { grid-template-columns: 1fr; }
.grid-tablet { grid-template-columns: repeat(2, 1fr); }
.grid-desktop { grid-template-columns: repeat(3, 1fr); }

/* CARD */
.game-card {
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid rgba(255,255,255,0.1);
}

.game-card:hover {
    transform: translateY(-8px);
    border-color: rgba(0,123,255,0.7);
    box-shadow: 0 0 20px rgba(0,123,255,0.4);
}

.img-container {
    height: 160px;
    position: relative;
}

.img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.game-name {
    padding: 12px;
    font-size: 0.9rem;
    text-transform: lowercase;
    background: rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<div class="background">
    <div class="glow-ring glow-1"></div>
    <div class="glow-ring glow-2"></div>
</div>

<div class="container">

    <div class="title">GAMES</div>

    <div class="controls">
        <input id="searchInput" class="search-input" placeholder="Search games...">
        <select id="gridSelect" class="select">
            <option value="auto">Auto Grid</option>
            <option value="mobile">Mobile</option>
            <option value="tablet">Tablet</option>
            <option value="desktop">Desktop</option>
        </select>
    </div>

    <div class="games-grid grid-desktop" id="gamesGrid"></div>

</div>

<script>
const gamesGrid = document.getElementById("gamesGrid");
const searchInput = document.getElementById("searchInput");
const gridSelect = document.getElementById("gridSelect");

let games = []; // 1. Initialize an empty array globally

/* ========================= 500+ GAME DATA SYSTEM ========================= */
fetch("./games.json")
    .then(res => res.json())
    .then(data => {
        games = data; // 2. Assign the fetched data to the global variable
        render(games); // 3. Initial render once data arrives
    })
    .catch(err => console.error("Error loading games:", err));

/* ========================= RENDER SYSTEM ========================= */
function render(list) {
    gamesGrid.innerHTML = "";
    list.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
            <div class="img-container" onclick="location.href='${game.url}'">
                <img src="${game.img}" loading="lazy">
            </div>
            <div class="game-name">${game.name}</div>
        `;
        gamesGrid.appendChild(card);
    });
}

// Remove the standalone render(games) call that was here


/* =========================
   SEARCH
========================= */

searchInput.addEventListener("input", () => {
    const value = searchInput.value.toLowerCase();
    render(games.filter(g => g.name.toLowerCase().includes(value)));
});

/* =========================
   GRID CONTROL
========================= */

function updateGrid() {
    const val = gridSelect.value;

    gamesGrid.classList.remove("grid-mobile","grid-tablet","grid-desktop");

    if (val === "auto") {
        const w = window.innerWidth;
        if (w < 768) gamesGrid.classList.add("grid-mobile");
        else if (w < 1024) gamesGrid.classList.add("grid-tablet");
        else gamesGrid.classList.add("grid-desktop");
    } else {
        gamesGrid.classList.add(`grid-${val}`);
    }
}

gridSelect.addEventListener("change", updateGrid);
window.addEventListener("resize", updateGrid);

updateGrid();

</script>

</body>
</html>
