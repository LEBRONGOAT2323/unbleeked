<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMES | UNBLEEKED</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Orbitron', monospace;
    background: linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#111);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

@keyframes gradient {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* BACKGROUND */
.background {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.glow-ring {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
}

.glow-1 {
    top: 20%;
    left: 20%;
    width: 400px;
    height: 400px;
    background: rgba(0,123,255,0.15);
}

.glow-2 {
    bottom: 20%;
    right: 20%;
    width: 400px;
    height: 400px;
    background: rgba(255,255,255,0.05);
}

/* LAYOUT */
.container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

 /* This forces everything inside the header to the center */
.header {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    background: rgba(212, 175, 55, 0.1);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 0.75rem;
    color: #ffffff;
    text-decoration: none;
    transition: all 0.3s ease;
    margin: 0 auto 1rem auto; /* Centers it and adds gap below */
    width: fit-content;
}

.back-btn:hover {
    background: rgba(0, 123, 255, 0.2);
    border-color: #007bff;
}

    
/* HEADER */
.title {
    text-align: center;
    font-size: 3rem;
    font-weight: 900;
    margin-bottom: 20px;
    text-shadow: 0 0 20px rgba(0,123,255,0.6);
}

.typewriter {
            border-right: 2px solid #ffffff;
            animation: typewriter 4s steps(5) 1s infinite, blink 1s step-end infinite;
            white-space: nowrap;
            overflow: hidden;
            width: 5ch;
            margin: 0 auto;
        }
    
.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.search-input, .select {
    padding: 12px 15px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3);
    color: white;
    font-family: Orbitron;
}

.search-input {
    width: 250px;
}

/* GRID */
.games-grid {
    display: grid;
    gap: 15px;
    transition: 0.3s;
}

.grid-mobile { grid-template-columns: 1fr; }
.grid-tablet { grid-template-columns: repeat(2, 1fr); }
.grid-desktop { grid-template-columns: repeat(3, 1fr); }

/* CARD */
.game-card {
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid rgba(255,255,255,0.1);
}

.game-card:hover {
    transform: translateY(-8px);
    border-color: rgba(0,123,255,0.7);
    box-shadow: 0 0 20px rgba(0,123,255,0.4);
}

.img-container {
    height: 160px;
    position: relative;
}

.img-container::after{
    content:"📂";
    font-size:50px;
    opacity:0.2;
    position:absolute;
    z-index:1;
}
    
.img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.game-name {
    padding: 12px;
    font-size: 0.9rem;
    text-transform: lowercase;
    background: rgba(0,0,0,0.4);
}

/* Animations */
       @keyframes glow-pulse {
0% { text-shadow:0 0 10px rgba(0,123,255,0.7); }

100% { 
text-shadow:
0 0 20px rgba(0,123,255,0.9),
0 0 40px rgba(0,123,255,0.8),
0 0 70px rgba(0,123,255,0.7);
}
}

        @keyframes typewriter {
            from { width: 0; }
            to { width: 5ch; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #ffffff; }
        }

        @keyframes float {
0% {
transform: translate(0px, 0px) scale(1);
}
50% {
transform: translate(40px, -30px) scale(1.1);
}
100% {
transform: translate(0px, 0px) scale(1);
}
}

@keyframes pulseGlow {
0% { opacity: 0.3; }
50% { opacity: 0.6; }
100% { opacity: 0.3; }
}

        /* Responsive */
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .search-input { width: 250px; }
            .controls { gap: 1rem; }
            .footer-links { gap: 1rem; }
        }
    
</style>
</head>

<body>

<div class="background">
    <div class="glow-ring glow-1"></div>
    <div class="glow-ring glow-2"></div>
</div>

<div class="container">
    <!-- NEW WRAPPER HERE -->
    <div class="header-section">
        <a href="main.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9,22 9,12 15,12 15,22"/>
            </svg>
            Back to Homepage
        </a>

        <h1 class="title" onclick="location.href='/main.html'" style="cursor:pointer;">
            <span class="typewriter">GAMES</span>
        </h1>
    </div>

    <div class="controls">
        <input id="searchInput" class="search-input" placeholder="Search games...">
        <select id="gridSelect" class="select">
            <option value="auto">Auto Grid</option>
            <option value="mobile">Mobile</option>
            <option value="tablet">Tablet</option>
            <option value="desktop">Desktop</option>
        </select>
    </div>

    <div class="games-grid grid-desktop" id="gamesGrid"></div>

</div>

<script>
const gamesGrid = document.getElementById("gamesGrid");
const searchInput = document.getElementById("searchInput");
const gridSelect = document.getElementById("gridSelect");

let games = []; // 1. Initialize an empty array globally

/* ========================= 500+ GAME DATA SYSTEM ========================= */
fetch("./games.json")
    .then(res => res.json())
    .then(data => {
        // FILTER: This keeps only games that have a name and a URL.
        // It also hides any that start with the word "Game " followed by a number.
        games = data.filter(game => {
            const hasName = game.name && game.name.trim() !== "";
            const hasUrl = game.url && game.url.trim() !== "";
            const isNotFiller = !game.name.toLowerCase().startsWith("game "); 
            
            return hasName && hasUrl && isNotFiller;
        });

        render(games); 
    })
    .catch(err => console.error("Error loading games:", err));


/* ========================= RENDER SYSTEM ========================= */
function render(list) {
    gamesGrid.innerHTML = "";
    list.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
            <div class="img-container" onclick="location.href='${game.url}'">
                <img src="${game.img}" loading="lazy">
            </div>
            <div class="game-name">${game.name}</div>
        `;
        gamesGrid.appendChild(card);
    });
}

// Remove the standalone render(games) call that was here


/* =========================
   SEARCH
========================= */

searchInput.addEventListener("input", () => {
    const value = searchInput.value.toLowerCase();
    render(games.filter(g => g.name.toLowerCase().includes(value)));
});

/* =========================
   GRID CONTROL
========================= */

function updateGrid() {
    const val = gridSelect.value;

    gamesGrid.classList.remove("grid-mobile","grid-tablet","grid-desktop");

    if (val === "auto") {
        const w = window.innerWidth;
        if (w < 768) gamesGrid.classList.add("grid-mobile");
        else if (w < 1024) gamesGrid.classList.add("grid-tablet");
        else gamesGrid.classList.add("grid-desktop");
    } else {
        gamesGrid.classList.add(`grid-${val}`);
    }
}

gridSelect.addEventListener("change", updateGrid);
window.addEventListener("resize", updateGrid);

updateGrid();

</script>

</body>
</html>
