<!DOCTYPE html>
<html>
<head>
    <title>Etch-a-Sketch</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://files.catbox.moe/j364dj.png">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .credit {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
        }

        .credit a {
            color: black;
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .credit a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<iframe src="https://etchasketch69.vercel.app/" loading="lazy" allowfullscreen></iframe>

<div class="credit">
    <a href="https://github.com/michalosman" target="_blank">
        External game by michalosman
    </a>
</div>

</body>
</html>
