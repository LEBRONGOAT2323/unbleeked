<!DOCTYPE html>
<html>
<head>
    <title>fluidsimulator</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .credit {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
        }

        .credit a {
            color: black;
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .credit a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<iframe src="https://bi6zone.vercel.app/a/fluidsim/index.html" loading="lazy" allowfullscreen></iframe>

<div class="credit">
    <a href="https://github.com/PavelDoGreat" target="_blank">
        External game by PavelDoGreat
    </a>
</div>

</body>
</html>
