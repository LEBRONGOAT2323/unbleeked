<!DOCTYPE html>
<html>
<head>
    <title>TrollPulse</title>

    <link rel="icon" type="image/png" href="images/TrollPulseLogo.png">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .credit {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
        }

        .credit a {
            color: white;
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .credit a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<iframe src="https://trollpulse.vercel.app/"></iframe>

<div class="credit">
    <a href="https://github.com/LEBRONGOAT2323" target="_blank">
        External game by LEBRONGOAT2323
    </a>
</div>

</body>
</html>
