/* =========================
   BACKGROUND
========================= */

body::before {
    content: "";

    inset: 0;
    z-index: -3;
    pointer-events: none;
    opacity: 0.15;

    background-image:

        linear-gradient(

            rgba(255,255,255,0.035) 1px,
            transparent 1px
        );

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;

    background:
        radial-gradient(
            circle,
            transparent 25%,
            rgba(0,0,0,0.65) 100%
        );
}

.background {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
}

.glow-ring {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    transition: transform 0.25s ease-out;
}

.glow-1 {
    width: 450px;
    height: 450px;
    top: 10%;
    left: 5%;

    background: rgba(255,255,255,0.045);

    animation: floatOne 14s ease-in-out infinite;
}

.glow-2 {
    width: 500px;
    height: 500px;
    right: 0;
    bottom: 5%;

    background: rgba(255,255,255,0.035);

    animation: floatTwo 17s ease-in-out infinite;
}

@keyframes floatOne {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(45px,-30px) scale(1.1);
    }
}

@keyframes floatTwo {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(-40px,25px) scale(1.08);
    }
}

/* =========================
   LAYOUT
========================= */

.container {

.header-section {

    border-radius: 13px;

    box-shadow:

    transition:

}

.back-btn:hover {

    color: #fff;

    background: rgba(255,255,255,0.08);

/* =========================

========================= */

.search-input {

/* =========================

========================= */

.games-grid {

}

.grid-mobile {
    grid-template-columns: 1fr;
}

.grid-tablet {
    grid-template-columns: repeat(2, 1fr);
}

.grid-desktop {
    grid-template-columns: repeat(3, 1fr);
}

/* =========================
   GAME CARD
========================= */

.game-card {
    position: relative;

    overflow: hidden;

    cursor: pointer;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.065),
            rgba(255,255,255,0.025)

    border-radius: 20px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.06);

    transition:
        transform 0.4s cubic-bezier(.175,.885,.32,1.275),
        border-color 0.35s ease,
        box-shadow 0.35s ease;
}

.game-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: -130%;

    width: 80%;
    height: 100%;

    z-index: 5;

    pointer-events: none;

    background:

            transparent,
            rgba(255,255,255,0.1),
            transparent

    transition: left 0.7s ease;
}

.game-card:hover::before {
    left: 140%;
}

.game-card:hover {
    transform:

<script>

/* =========================
   ELEMENTS
========================= */

const searchInput =
    document.getElementById("searchInput");

const categorySelect =
    document.getElementById("categorySelect");

const gridSelect =
    document.getElementById("gridSelect");

const gamesGrid =
    document.getElementById("gamesGrid");

const gameCards =
    Array.from(
        document.querySelectorAll(".game-card")
    );

/* =========================
   SEARCH + CATEGORY
========================= */

function filterGames() {

    const searchTerm =
        searchInput.value
            .trim()
            .toLowerCase();

    const category =
        categorySelect.value;

    let visibleCount = 0;

    gameCards.forEach(card => {

        const gameName =
            card
                .querySelector(".game-name")
                .textContent
                .toLowerCase();

        const gameCategory =
            card.dataset.category || "pc";

        const matchesSearch =
            gameName.includes(searchTerm);

        const matchesCategory =
            category === "all" ||
            gameCategory === category;

        if (
            matchesSearch &&
            matchesCategory
        ) {

            card.style.display = "";

            visibleCount++;

        } else {

            card.style.display = "none";

        }

    });

    const existingMessage =
        document.querySelector(".no-results");

    if (existingMessage) {
        existingMessage.remove();
    }

    if (visibleCount === 0) {

        const message =
            document.createElement("div");

        message.className = "no-results";

        message.textContent =
            "NO SUBWAY SURFERS GAMES FOUND";

        gamesGrid.appendChild(message);
    }
}

searchInput.addEventListener(
    "input",
    filterGames
);

categorySelect.addEventListener(
    "change",
    filterGames
);

/* =========================
   GRID CONTROL
========================= */

function updateGrid() {

    const value =
        gridSelect.value;

    gamesGrid.classList.remove(
        "grid-mobile",
        "grid-tablet",
        "grid-desktop"
    );

    if (value === "auto") {

        const width =
            window.innerWidth;

        if (width < 768) {

            gamesGrid.classList.add(
                "grid-mobile"
            );

        } else if (width < 1050) {

            gamesGrid.classList.add(
                "grid-tablet"
            );

        } else {

            gamesGrid.classList.add(
                "grid-desktop"
            );
        }

    } else {

        gamesGrid.classList.add(
            `grid-${value}`
        );
    }
}

gridSelect.addEventListener(
    "change",
    updateGrid
);

window.addEventListener(
    "resize",
    updateGrid
);

updateGrid();

/* =========================
   OPEN BLANK
========================= */

function openBlank() {

    const newTab =
        window.open(
            "about:blank",
            "_blank"
        );

    if (!newTab) {

        alert("Popup blocked");

        return;
    }

    newTab.document.write(`
        <iframe
            src="${window.location.href}"
            style="
                position:fixed;
                top:0;
                left:0;
                width:100vw;
                height:100vh;
                border:none;
            "
        ></iframe>
    `);

    newTab.document.close();
}

/* =========================
   MOUSE PARALLAX
========================= */

const glow1 =
    document.querySelector(".glow-1");

const glow2 =
    document.querySelector(".glow-2");

document.addEventListener(
    "mousemove",
    event => {

        const x =
            event.clientX /
            window.innerWidth -
            0.5;

        const y =
            event.clientY /
            window.innerHeight -
            0.5;

        glow1.style.transform =
            `translate(${x * 35}px, ${y * 35}px)`;

        glow2.style.transform =
            `translate(${x * -30}px, ${y * -30}px)`;
    }
);

/* =========================
   TYPEWRITER
========================= */

const typewriter =
    document.getElementById("typewriter");

const text =
    "SUBWAY SURFERS";

let i = 0;

function typeEffect() {

    if (i < text.length) {

        typewriter.textContent +=
            text.charAt(i);

        i++;

        setTimeout(
            typeEffect,
            100
        );

    }
}

window.addEventListener(
    "load",
    typeEffect
);

</script>
