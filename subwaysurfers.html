    <style>
        * {

        body {

        @keyframes gradient{
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
        }
        
        

        .container {

        /* Background Effects */
        .background {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .glow-ring {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }

        .glow-1 {
top: 25%;
left: 25%;
width: 400px;
height: 400px;
background: rgba(212, 175, 55, 0.1);
animation: float 12s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
}

.glow-2 {
bottom: 25%;
right: 25%;
width: 400px;
height: 400px;
background: rgba(212, 175, 55, 0.08);
animation: float 16s ease-in-out infinite reverse, pulseGlow 8s ease-in-out infinite;
}

.glow-3 {
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 800px;
height: 800px;
background: rgba(212, 175, 55, 0.05);
filter: blur(120px);
animation: float 20s ease-in-out infinite, pulseGlow 10s ease-in-out infinite;
}

        /* Header */
        .header {
            text-align: center;
            padding: 2rem 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.75rem;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #ffffff;
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            color: white;
            text-shadow:0 0 10px rgba(0,123,255,0.7);
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            animation: glow-pulse 2s ease-in-out infinite alternate;
        }

        .typewriter {
            border-right: 2px solid #ffffff;
            animation: typewriter 4s steps(5) 1s infinite, blink 1s step-end infinite;
            white-space: nowrap;
            overflow: hidden;
            width: 5ch;
            margin: 0 auto;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 300px;
            height: 3.5rem;
            padding: 0 1rem 0 3rem;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.75rem;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Orbitron', monospace;
        }

        .search-input:focus {
            outline: none;
            border-color: #ffffff;
              box-shadow: 0 0 25px rgba(255,255,255,0.4);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
        }

        .select-container {
            position: relative;
        }

        .select {
            height: 3.5rem;
            padding: 0 2.5rem 0 1rem;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.75rem;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            appearance: none;
        }
        
        .select option {
            color: #000000;
            background: #ffffff;
        }

        .select:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255,255,255,0.4);
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .grid-mobile { grid-template-columns: 1fr; }
        .grid-tablet { grid-template-columns: repeat(2, 1fr); }
        .grid-desktop { grid-template-columns: repeat(3, 1fr); }

        .game-card{
cursor:pointer;
background:rgba(0,0,0,0.3);
backdrop-filter:blur(10px);
border:1px solid rgba(0,0,0,0.3);
border:1px solid rgba(255,255,255,0.1);

        .footer-link::after {

            width: 100%;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #ffffff;

        .footer-link:hover::after {

        }

        .footer-link:hover {

        /* Animations */
       @keyframes glow-pulse {
0% { text-shadow:0 0 10px rgba(0,123,255,0.7); }

100% { 
text-shadow:
0 0 20px rgba(0,123,255,0.9),
0 0 40px rgba(0,123,255,0.8),

        @keyframes typewriter {

            to { width: 5ch; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #ffffff; }

        @keyframes float {
0% {
transform: translate(0px, 0px) scale(1);
}
50% {
transform: translate(40px, -30px) scale(1.1);
}
100% {
transform: translate(0px, 0px) scale(1);
}
}

@keyframes pulseGlow {
0% { opacity: 0.3; }
50% { opacity: 0.6; }
100% { opacity: 0.3; }
}

        /* Responsive */

        .game-card{
transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
}
        
    </style>

    <script>
        // Get elements
        const searchInput = document.getElementById('searchInput');
        const categorySelect = document.getElementById('categorySelect');
        const gridSelect = document.getElementById('gridSelect');
        const gamesGrid = document.getElementById('gamesGrid');
        const gameCards = document.querySelectorAll('.game-card');

        // Search functionality
        searchInput.addEventListener('input', filterGames);
        categorySelect.addEventListener('change', filterGames);
        gridSelect.addEventListener('change', changeGrid);

        function filterGames() {
    const searchTerm = searchInput.value.toLowerCase();
    const category = categorySelect.value;

    gameCards.forEach(card => {
        const gameName = card.querySelector('.game-name').textContent.toLowerCase();
        const gameCategory = card.dataset.category || 'pc';

        const matchesSearch = gameName.includes(searchTerm);
        const matchesCategory = category === 'all' || gameCategory === category;

        if (matchesSearch && matchesCategory) {
            card.style.display = "";
        } else {
            card.style.display = "none";
        }
    });
}

        function changeGrid() {
            const gridType = gridSelect.value;
            
            // Remove all grid classes
            gamesGrid.classList.remove('grid-mobile', 'grid-tablet', 'grid-desktop');
            
            // Add appropriate grid class
            if (gridType === 'auto') {
                gamesGrid.classList.add('grid-desktop'); // default to desktop
            } else {
                gamesGrid.classList.add(`grid-${gridType}`);
            }
        }

        // Auto grid functionality (responsive)
        function handleAutoGrid() {
            if (gridSelect.value === 'auto') {
                const width = window.innerWidth;
                gamesGrid.classList.remove('grid-mobile', 'grid-tablet', 'grid-desktop');
                
                if (width <= 768) {
                    gamesGrid.classList.add('grid-mobile');
                } else if (width <= 1024) {
                    gamesGrid.classList.add('grid-tablet');
                } else {
                    gamesGrid.classList.add('grid-desktop');
                }
            }
        }

        // Listen for window resize for auto grid
        window.addEventListener('resize', handleAutoGrid);
        
        // Initial auto grid setup
        handleAutoGrid();
    </script>
    <script>
        function openBlank() {
    const newTab = window.open('about:blank', '_blank');

    if (!newTab) {
        alert("Popup blocked");
        return;
    }

    newTab.document.write(`
    <iframe src="${window.location.href}" 
    style="position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;">
    </iframe>
`);

    newTab.document.close();
}
        
        const glow1 = document.querySelector(".glow-1");
const glow2 = document.querySelector(".glow-2");
const glow3 = document.querySelector(".glow-3");

document.addEventListener("mousemove", (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;

    glow1.style.transform = `translate(${x*40}px, ${y*40}px)`;
    glow2.style.transform = `translate(${x*60}px, ${y*60}px)`;
    glow3.style.transform = `translate(${x*20}px, ${y*20}px)`;
});
        const typewriter = document.getElementById('typewriter');
        const text = 'Subway Surfers Series';
        let i = 0;

        function typeEffect() {
            if (i < text.length) {
                typewriter.textContent += text.charAt(i);
                i++;
                setTimeout(typeEffect, 150);
            }
        }

        // Start typewriter effect when page loads
        window.addEventListener('load', typeEffect);
        </script>
