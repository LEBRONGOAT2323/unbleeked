<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
             font-family: 'Orbitron', monospace;
            background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#111);
            background-size:400% 400%;
            animation:gradient 15s ease infinite;
            color:white;
            text-align:center;
            min-height:100vh;
            overflow-x:hidden;
            overflow-x: hidden;
        }
        
        @keyframes gradient{
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
        }
        
        

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* Background Effects */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .glow-ring {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }

        .glow-1 {
top: 25%;
left: 25%;
width: 400px;
height: 400px;
background: rgba(212, 175, 55, 0.1);
animation: float 12s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
}

.glow-2 {
bottom: 25%;
right: 25%;
width: 400px;
height: 400px;
background: rgba(212, 175, 55, 0.08);
animation: float 16s ease-in-out infinite reverse, pulseGlow 8s ease-in-out infinite;
}

.glow-3 {
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 800px;
height: 800px;
background: rgba(212, 175, 55, 0.05);
filter: blur(120px);
animation: float 20s ease-in-out infinite, pulseGlow 10s ease-in-out infinite;
}

        /* Header */
        .header {
            text-align: center;
            padding: 2rem 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.75rem;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #ffffff;
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            color: white;
            text-shadow:0 0 10px rgba(0,123,255,0.7);
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            animation: glow-pulse 2s ease-in-out infinite alternate;
        }

        .typewriter {
            border-right: 2px solid #ffffff;
            animation: typewriter 4s steps(5) 1s infinite, blink 1s step-end infinite;
            white-space: nowrap;
            overflow: hidden;
            width: 5ch;
            margin: 0 auto;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 300px;
            height: 3.5rem;
            padding: 0 1rem 0 3rem;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.75rem;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Orbitron', monospace;
        }

        .search-input:focus {
            outline: none;
            border-color: #ffffff;
              box-shadow: 0 0 25px rgba(255,255,255,0.4);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
        }

        .select-container {
            position: relative;
        }

        .select {
            height: 3.5rem;
            padding: 0 2.5rem 0 1rem;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.75rem;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            appearance: none;
        }
        
        .select option {
            color: #000000;
            background: #ffffff;
        }

        .select:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255,255,255,0.4);
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .grid-mobile { grid-template-columns: 1fr; }
        .grid-tablet { grid-template-columns: repeat(2, 1fr); }
        .grid-desktop { grid-template-columns: repeat(3, 1fr); }

        .game-card{
cursor:pointer;
background:rgba(0,0,0,0.3);
backdrop-filter:blur(10px);
border:1px solid rgba(0,0,0,0.3);
border-radius:20px;
overflow:hidden;
transition:0.4s;
}

.img-container{
width:100%;
height:180px;
background:linear-gradient(45deg,#1e1e2f,#2a2a40);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.img-container img {
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    top:0;
    left:0;
    z-index:2;
}

.img-container::after{
    content:"📂";
    font-size:50px;
    opacity:0.2;
    position:absolute;
    z-index:1;
}

.game-card img{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
top:0;
left:0;
}

.game-card:hover{
transform:translateY(-10px);
border-color:#007bff;
box-shadow:0 0 20px rgba(0,123,255,0.6);
}

.game-card p{
padding:15px;
margin:0;
font-weight:600;
background:rgba(0,0,0,0.3);
}

        .game-name {
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            height: 50px;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffffff;
            text-transform: lowercase;
        }
        
        .games-grid{
            transition:all 0.3s ease;
        }


        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 0;
            border-top: 1px solid rgba(255,255,255,0.2);
            margin-top: 2rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .footer-link {
            color: #ffffff;
            text-decoration: none;
            position: relative;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .footer-link::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #ffffff;
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.3s ease;
        }

        .footer-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        .footer-link:hover {
            text-shadow: 0 0 10px #ffffff;
        }

        /* Animations */
       @keyframes glow-pulse {
0% { text-shadow:0 0 10px rgba(0,123,255,0.7); }

100% { 
text-shadow:
0 0 20px rgba(0,123,255,0.9),
0 0 40px rgba(0,123,255,0.8),
0 0 70px rgba(0,123,255,0.7);
}
}

        @keyframes typewriter {
            from { width: 0; }
            to { width: 5ch; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #ffffff; }
        }

        @keyframes float {
0% {
transform: translate(0px, 0px) scale(1);
}
50% {
transform: translate(40px, -30px) scale(1.1);
}
100% {
transform: translate(0px, 0px) scale(1);
}
}

@keyframes pulseGlow {
0% { opacity: 0.3; }
50% { opacity: 0.6; }
100% { opacity: 0.3; }
}

        /* Responsive */
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .search-input { width: 250px; }
            .controls { gap: 1rem; }
            .footer-links { gap: 1rem; }
        }
    </style>
</head>

    <script>
        // Get elements
        const searchInput = document.getElementById('searchInput');
        const gridSelect = document.getElementById('gridSelect');
        const gamesGrid = document.getElementById('gamesGrid');
        const gameCards = document.querySelectorAll('.game-card');

        // Search functionality
        searchInput.addEventListener('input', filterGames);
        gridSelect.addEventListener('change', changeGrid);

        function filterGames() {
    const searchTerm = searchInput.value.toLowerCase();

    gameCards.forEach(card => {
        const gameName = card.querySelector('.game-name').textContent.toLowerCase();

        if (gameName.includes(searchTerm)) {
    card.style.display = "";
} else {
    card.style.display = "none";
}
    });
}

        function changeGrid() {
            const gridType = gridSelect.value;
            
            // Remove all grid classes
            gamesGrid.classList.remove('grid-mobile', 'grid-tablet', 'grid-desktop');
            
            // Add appropriate grid class
            if (gridType === 'auto') {
                gamesGrid.classList.add('grid-desktop'); // default to desktop
            } else {
                gamesGrid.classList.add(`grid-${gridType}`);
            }
        }

        // Auto grid functionality (responsive)
        function handleAutoGrid() {
            if (gridSelect.value === 'auto') {
                const width = window.innerWidth;
                gamesGrid.classList.remove('grid-mobile', 'grid-tablet', 'grid-desktop');
                
                if (width <= 768) {
                    gamesGrid.classList.add('grid-mobile');
                } else if (width <= 1024) {
                    gamesGrid.classList.add('grid-tablet');
                } else {
                    gamesGrid.classList.add('grid-desktop');
                }
            }
        }

        // Listen for window resize for auto grid
        window.addEventListener('resize', handleAutoGrid);
        
        // Initial auto grid setup
        handleAutoGrid();
    </script>

        style="position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;"

    `);

    newTab.document.close();
}
