<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="https://files.catbox.moe/j364dj.png">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #070707;
        --bg-soft: #0d0d0d;
        --card: rgba(18, 18, 18, 0.72);
        --card-hover: rgba(25, 25, 25, 0.9);
        --border: rgba(255, 255, 255, 0.09);
        --border-hover: rgba(255, 255, 255, 0.28);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.55);
    }

    body {
        font-family: "Orbitron", monospace;
        background:
            radial-gradient(circle at 15% 20%, rgba(255,255,255,0.035), transparent 30%),
            radial-gradient(circle at 85% 75%, rgba(255,255,255,0.025), transparent 30%),
            #070707;
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Subtle background grid */

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.18;
        background-image:
            linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 45px 45px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    /* BACKGROUND */

    .background {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .glow-ring {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
    }

    .glow-1 {
        top: 5%;
        left: 5%;
        width: 350px;
        height: 350px;
        background: rgba(255,255,255,0.025);
        animation: floatOne 14s ease-in-out infinite;
    }

    .glow-2 {
        bottom: 5%;
        right: 5%;
        width: 400px;
        height: 400px;
        background: rgba(255,255,255,0.02);
        animation: floatTwo 18s ease-in-out infinite;
    }

    .glow-3 {
        top: 45%;
        left: 50%;
        transform: translateX(-50%);
        width: 700px;
        height: 700px;
        background: rgba(255,255,255,0.012);
        filter: blur(150px);
    }

    @keyframes floatOne {
        0%, 100% {
            transform: translate(0, 0);
        }

        50% {
            transform: translate(45px, -30px);
        }
    }

    @keyframes floatTwo {
        0%, 100% {
            transform: translate(0, 0);
        }

        50% {
            transform: translate(-35px, 30px);
        }
    }

    /* LAYOUT */

    .container {
        position: relative;
        z-index: 5;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    /* HEADER */

    .header {
        text-align: center;
        padding: 42px 0 30px;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 12px 18px;
        margin-bottom: 30px;

        background: rgba(255,255,255,0.035);
        border: 1px solid var(--border);
        border-radius: 10px;

        color: #fff;
        text-decoration: none;
        font-family: "Orbitron", monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;

        backdrop-filter: blur(12px);
        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            transform 0.25s ease;
    }

    .back-btn:hover {
        background: rgba(255,255,255,0.08);
        border-color: var(--border-hover);
        transform: translateY(-2px);
    }

    .back-btn svg {
        opacity: 0.75;
    }

    /* TITLE */

    .title {
        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 76px;

        font-family: "Orbitron", monospace;
        font-size: clamp(2.7rem, 7vw, 4.8rem);
        font-weight: 900;
        letter-spacing: 0.22em;

        color: #fff;

        cursor: pointer;
        user-select: none;

        text-shadow:
            0 0 18px rgba(255,255,255,0.12);

        animation: titlePulse 3s ease-in-out infinite alternate;
    }

    .typewriter {
        white-space: nowrap;
    }

    .cursor {
        margin-left: 5px;
        font-weight: 400;
        opacity: 0.8;
        animation: cursorBlink 0.9s infinite;
    }

    @keyframes titlePulse {
        from {
            text-shadow: 0 0 12px rgba(255,255,255,0.08);
        }

        to {
            text-shadow:
                0 0 20px rgba(255,255,255,0.18),
                0 0 45px rgba(255,255,255,0.07);
        }
    }

    @keyframes cursorBlink {
        0%, 45% {
            opacity: 1;
        }

        46%, 100% {
            opacity: 0;
        }
    }

    /* CONTROLS */

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 12px 0 34px;
        flex-wrap: wrap;
    }

    .search-container {
        position: relative;
    }

    .search-input {
        width: 320px;
        height: 48px;

        padding: 0 16px 0 46px;

        background: rgba(255,255,255,0.035);
        border: 1px solid var(--border);
        border-radius: 10px;

        color: #fff;
        font-family: "Orbitron", monospace;
        font-size: 12px;
        font-weight: 500;

        outline: none;
        backdrop-filter: blur(12px);

        transition:
            border-color 0.25s ease,
            background 0.25s ease,
            box-shadow 0.25s ease;
    }

    .search-input::placeholder {
        color: rgba(255,255,255,0.35);
    }

    .search-input:focus {
        background: rgba(255,255,255,0.055);
        border-color: rgba(255,255,255,0.28);
        box-shadow: 0 0 25px rgba(255,255,255,0.045);
    }

    .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255,255,255,0.42);
        pointer-events: none;
    }

    .select-container {
        position: relative;
    }

    .select {
        height: 48px;
        min-width: 180px;

        padding: 0 38px 0 15px;

        background: rgba(255,255,255,0.035);
        border: 1px solid var(--border);
        border-radius: 10px;

        color: #fff;
        font-family: "Orbitron", monospace;
        font-size: 11px;
        font-weight: 600;

        cursor: pointer;
        outline: none;
        appearance: none;

        backdrop-filter: blur(12px);

        transition:
            border-color 0.25s ease,
            background 0.25s ease;
    }

    .select:hover {
        background: rgba(255,255,255,0.055);
        border-color: rgba(255,255,255,0.18);
    }

    .select:focus {
        border-color: rgba(255,255,255,0.28);
        box-shadow: 0 0 25px rgba(255,255,255,0.045);
    }

    .select option {
        background: #101010;
        color: #fff;
    }

    /* GRID */

    .games-grid {
        display: grid;
        gap: 18px;
        margin-bottom: 65px;
        transition: opacity 0.2s ease;
    }

    .grid-mobile {
        grid-template-columns: 1fr;
    }

    .grid-tablet {
        grid-template-columns: repeat(2, 1fr);
    }

    .grid-desktop {
        grid-template-columns: repeat(3, 1fr);
    }

    /* CARDS */

    .game-card {
        position: relative;

        cursor: pointer;

        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;

        overflow: hidden;

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        transition:
            transform 0.3s cubic-bezier(.2,.8,.2,1),
            border-color 0.3s ease,
            box-shadow 0.3s ease,
            background 0.3s ease;
    }

    .game-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;

        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.18),
            transparent
        );

        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 4;
    }

    .game-card:hover {
        transform: translateY(-7px);

        background: var(--card-hover);
        border-color: var(--border-hover);

        box-shadow:
            0 18px 45px rgba(0,0,0,0.35),
            0 0 25px rgba(255,255,255,0.035);
    }

    .game-card:hover::before {
        opacity: 1;
    }

    /* IMAGE */

    .img-container {
        width: 100%;
        height: 185px;

        position: relative;
        overflow: hidden;

        background: #111;
    }

    .img-container::after {
        content: "";
        position: absolute;
        inset: 0;

        background:
            linear-gradient(
                to bottom,
                transparent 45%,
                rgba(0,0,0,0.22)
            );

        pointer-events: none;
        z-index: 3;
    }

    .img-container img {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        z-index: 2;

        transition:
            transform 0.5s cubic-bezier(.2,.8,.2,1),
            filter 0.4s ease;
    }

    .game-card:hover .img-container img {
        transform: scale(1.045);
        filter: brightness(1.08);
    }

    /* NAME */

    .game-name {
        min-height: 58px;

        display: flex;
        align-items: center;

        padding: 14px 16px;

        background: rgba(8,8,8,0.72);
        border-top: 1px solid rgba(255,255,255,0.06);

        color: #fff;

        font-family: "Orbitron", monospace;
        font-size: 11px;
        font-weight: 700;

        line-height: 1.5;
        letter-spacing: 0.035em;

        text-transform: lowercase;
    }

    /* FOOTER */

    .footer {
        padding: 28px 0 34px;
        border-top: 1px solid rgba(255,255,255,0.08);
        margin-top: 10px;
    }

    .footer-links {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 26px;
        flex-wrap: wrap;
    }

    .footer-link {
        position: relative;

        color: rgba(255,255,255,0.52);

        text-decoration: none;

        font-family: "Orbitron", monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;

        transition:
            color 0.25s ease,
            text-shadow 0.25s ease;
    }

    .footer-link::after {
        content: "";

        position: absolute;
        left: 0;
        bottom: -5px;

        width: 100%;
        height: 1px;

        background: #fff;

        transform: scaleX(0);
        transform-origin: right;

        transition: transform 0.25s ease;
    }

    .footer-link:hover {
        color: #fff;
        text-shadow: 0 0 12px rgba(255,255,255,0.25);
    }

    .footer-link:hover::after {
        transform: scaleX(1);
        transform-origin: left;
    }

    /* RESPONSIVE */

    @media (max-width: 768px) {
        .container {
            padding: 0 15px;
        }

        .header {
            padding-top: 30px;
        }

        .title {
            font-size: 2.5rem;
            letter-spacing: 0.13em;
        }

        .controls {
            gap: 10px;
            margin-bottom: 28px;
        }

        .search-input {
            width: min(320px, 90vw);
        }

        .select {
            min-width: 150px;
        }

        .img-container {
            height: 175px;
        }

        .footer-links {
            gap: 18px;
        }
    }

    @media (max-width: 480px) {
        .title {
            font-size: 2rem;
        }

        .controls {
            flex-direction: column;
        }

        .search-input,
        .select {
            width: min(330px, 92vw);
        }

        .img-container {
            height: 180px;
        }
    }
</style>


</head>

<script>
    const searchInput = document.getElementById("searchInput");
    const gridSelect = document.getElementById("gridSelect");
    const gamesGrid = document.getElementById("gamesGrid");
    const gameCards = document.querySelectorAll(".game-card");

    /* SEARCH */

    searchInput.addEventListener("input", filterGames);

    function filterGames() {
        const searchTerm = searchInput.value.toLowerCase().trim();

        gameCards.forEach(card => {
            const gameName =
                card.querySelector(".game-name")
                    .textContent
                    .toLowerCase();

            card.style.display =
                gameName.includes(searchTerm) ? "" : "none";
        });
    }

    /* GRID */

    gridSelect.addEventListener("change", changeGrid);

    function changeGrid() {
        const gridType = gridSelect.value;

        gamesGrid.classList.remove(
            "grid-mobile",
            "grid-tablet",
            "grid-desktop"
        );

        if (gridType === "auto") {
            handleAutoGrid();
        } else {
            gamesGrid.classList.add(`grid-${gridType}`);
        }
    }

    function handleAutoGrid() {
        if (gridSelect.value !== "auto") return;

        const width = window.innerWidth;

        gamesGrid.classList.remove(
            "grid-mobile",
            "grid-tablet",
            "grid-desktop"
        );

        if (width <= 768) {
            gamesGrid.classList.add("grid-mobile");
        } else if (width <= 1024) {
            gamesGrid.classList.add("grid-tablet");
        } else {
            gamesGrid.classList.add("grid-desktop");
        }
    }

    window.addEventListener("resize", handleAutoGrid);

    handleAutoGrid();

    /* OPEN BLANK */

    function openBlank() {
        const newTab = window.open("about:blank", "_blank");

        if (!newTab) {
            alert("Popup blocked");
            return;
        }

        newTab.document.write(`
            <iframe
                src="${window.location.href}"
                style="
                    position:fixed;
                    top:0;
                    left:0;
                    width:100vw;
                    height:100vh;
                    border:none;
                ">
            </iframe>
        `);

        newTab.document.close();
    }
</script>
