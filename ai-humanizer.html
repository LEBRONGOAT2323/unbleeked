<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Humanizer | UNBLEEKED</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Orbitron', monospace;
background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#111);
background-size:400% 400%;
animation:gradient 15s ease infinite;
color:white;
min-height:100vh;
overflow-x:hidden;
}

@keyframes gradient{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* BACKGROUND GLOW */
.background{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
}

.glow-ring{
position:absolute;
border-radius:50%;
filter:blur(80px);
}

.glow-1{
top:25%;
left:25%;
width:400px;
height:400px;
background:rgba(0,123,255,0.15);
animation:float 12s ease-in-out infinite;
}

.glow-2{
bottom:25%;
right:25%;
width:400px;
height:400px;
background:rgba(0,123,255,0.1);
animation:float 16s ease-in-out infinite reverse;
}

.glow-3{
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:800px;
height:800px;
background:rgba(0,123,255,0.05);
filter:blur(120px);
animation:float 20s ease-in-out infinite;
}

@keyframes float{
0%{transform:translate(0,0) scale(1);}
50%{transform:translate(40px,-30px) scale(1.1);}
100%{transform:translate(0,0) scale(1);}
}

/* LAYOUT */
.container{
max-width:1200px;
margin:auto;
padding:2rem;
position:relative;
z-index:10;
}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:2rem;
flex-wrap:wrap;
gap:1rem;
}

.btn{
background:rgba(0,0,0,0.3);
border:1px solid rgba(255,255,255,0.3);
border-radius:0.75rem;
color:white;
padding:0.7rem 1.3rem;
cursor:pointer;
transition:0.3s;
text-decoration:none;
font-family: 'Inter', 'JetBrains Mono', -apple-system, BlinkMacSystemFont, sans-serif;
}

.btn:hover{
border-color:#007bff;
box-shadow:0 0 15px rgba(0,123,255,0.6);
}

/* Ensure dropdown button matches Orbitron font */
.orbitron-btn {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    transition: 0.3s;
}

.orbitron-btn:hover {
    border-color: #007bff;
    box-shadow: 0 0 15px rgba(0,123,255,0.6);
}

/* DROPDOWN CONTAINER */
.dropdown-container {
    position: relative; /* makes the menu position relative to the button */
    display: inline-block;
}

/* DROPDOWN BUTTON */
.orbitron-btn {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    transition: 0.3s;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 0.75rem;
    color: white;
    padding: 0.7rem 1.3rem;
    cursor: pointer;
}

.orbitron-btn:hover {
    border-color: #007bff;
    box-shadow: 0 0 15px rgba(0,123,255,0.6);
}

/* DROPDOWN MENU */
.dropdown-menu {
    position: absolute;
    top: 100%;      /* directly below button */
    right: 0;       /* align to right edge */
    margin-top: 6px; /* small gap from button */
    background: rgba(0,0,0,0.9);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 0.5rem 0;
    min-width: 180px;
    backdrop-filter: blur(10px);
    z-index: 100;
    font-family: 'Orbitron', monospace;
    box-shadow: 0 0 20px rgba(0,123,255,0.4);
    opacity: 0;
    transform: translateY(-10px);
    transition: transform 0.2s ease, opacity 0.2s ease;
    pointer-events: none; /* prevents accidental hover when hidden */
}

/* SHOW MENU */
.dropdown-menu.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto; /* allows clicking links */
}

/* DROPDOWN LINKS */
.dropdown-menu a {
    display: block;
    padding: 0.6rem 1rem;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.2s;
}

.dropdown-menu a:hover {
    background: rgba(0,123,255,0.3);
}

/* TITLE */
.title{
text-align:center;
font-size:3.5rem;
font-weight:900;
letter-spacing:0.2em;
margin-bottom:0.5rem;
text-shadow:0 0 15px rgba(0,123,255,0.7);
animation:glow-pulse 2s infinite alternate;
}

@keyframes glow-pulse{
0%{text-shadow:0 0 10px rgba(0,123,255,0.7);}
100%{
text-shadow:
0 0 20px rgba(0,123,255,0.9),
0 0 40px rgba(0,123,255,0.8),
0 0 70px rgba(0,123,255,0.7);
}
}

.subtitle{
text-align:center;
opacity:0.7;
margin-bottom:2rem;
}

/* PANELS */
.workspace{
display:grid;
grid-template-columns:1fr 1fr;
gap:1.5rem;
}

.panel{
background:rgba(0,0,0,0.3);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.2);
border-radius:20px;
padding:1.5rem;
display:flex;
flex-direction:column;
}

.panel:hover{
border-color:#007bff;
box-shadow:0 0 20px rgba(0,123,255,0.4);
}

.panel h2{
margin-bottom:1rem;
}

/* TEXT AREAS */
textarea{
flex:1;
background:rgba(0,0,0,0.5);
border:1px solid rgba(255,255,255,0.2);
border-radius:15px;
padding:1rem;
color:white;
resize:none;
min-height:200px;
font-family:inherit;
}

textarea:focus{
outline:none;
border-color:#007bff;
box-shadow:0 0 15px rgba(0,123,255,0.5);
}

.output{
flex:1;
background:rgba(0,0,0,0.5);
border:1px solid rgba(255,255,255,0.2);
border-radius:15px;
padding:1rem;
overflow-y:auto;
white-space:pre-wrap;
}

/* ACTIONS */
.actions{
display:flex;
gap:1rem;
margin-top:1rem;
flex-wrap:wrap;
}

.primary{
background:#007bff;
border:none;
}

.primary:hover{
box-shadow:0 0 20px rgba(0,123,255,0.8);
}

/* MOBILE */
@media(max-width:900px){
.workspace{grid-template-columns:1fr;}
.title{font-size:2.5rem;}
}



</style>
</head>

<body>

<div class="background">
<div class="glow-ring glow-1"></div>
<div class="glow-ring glow-2"></div>
<div class="glow-ring glow-3"></div>
</div>

<div class="container">

<div class="top-bar">
    <a href="main.html" class="btn">⬅ Back</a>

    <!-- DROPDOWN -->
<div class="dropdown-container">
    <button class="btn orbitron-btn" id="moreBtn" onclick="toggleDropdown()">
        More ▼
    </button>

         <div class="dropdown-menu" id="dropdownMenu">
            <a href="pdf-chat.html">📄 PDF Chat</a>
            <a href="youtube-summarizer.html">🎥 YouTube Summarizer</a>
            <a href="main.html">🚀 Exit</a>
         </div>
    </div>
</div>

<h1 class="title">HUMANIZER</h1>
<p class="subtitle">Make AI text sound actually human</p>

<div class="workspace">

<!-- INPUT -->
<div class="panel">
<h2>Input</h2>
<textarea id="inputText" placeholder="Paste AI text..."></textarea>

<div class="actions">
<button class="btn primary" onclick="humanizeText()">✨ Humanize</button>
<button class="btn" onclick="clearInput()">Clear</button>
</div>
</div>

<!-- OUTPUT -->
<div class="panel">
<h2>Output</h2>
<div id="outputText" class="output">Your result will appear here...</div>

<div class="actions">
<button class="btn" onclick="copyText()">Copy</button>
<button class="btn" onclick="clearOutput()">Clear</button>
</div>
</div>

</div>
</div>

<script>
function humanizeText(){
let text=document.getElementById("inputText").value.trim();
if(!text){alert("Enter text");return;}

const map={
"furthermore":"also",
"moreover":"plus",
"in conclusion":"so basically",
"due to the fact that":"because",
"utilize":"use",
"individuals":"people"
};

for(let k in map){
text=text.replace(new RegExp(k,"gi"),map[k]);
}

document.getElementById("outputText").textContent=text;
}

function clearInput(){
document.getElementById("inputText").value="";
}

function clearOutput(){
document.getElementById("outputText").textContent="Your result will appear here...";
}

function copyText(){
navigator.clipboard.writeText(document.getElementById("outputText").textContent);
}
</script>

<script>
function toggleDropdown(){
document.getElementById("dropdownMenu").classList.toggle("show");
}

document.addEventListener("click", function(e){
const container = document.querySelector(".dropdown-container");

if(!container.contains(e.target)){
document.getElementById("dropdownMenu").classList.remove("show");
}
});
</script>

</body>
</html>
