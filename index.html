<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting | UNBLEEKED</title>

<link id="favicon" rel="icon" type="image/x-icon" href="https://files.catbox.moe/j364dj.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Orbitron', monospace;
background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#111);
background-size:400% 400%;
animation:gradient 15s ease infinite;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

   /* dotted pattern */
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#ffffff09 1px, transparent 1px);
        background-size: 18px 18px;
        pointer-events: none;
    }

/* animated background */
@keyframes gradient{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* glow background */
.background{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
}

.glow-ring{
position:absolute;
border-radius:50%;
filter:blur(80px);
}

.glow-1{
top:25%;
left:25%;
width:400px;
height:400px;
background:rgba(0,123,255,0.15);
animation:float 12s ease-in-out infinite;
}

.glow-2{
bottom:25%;
right:25%;
width:400px;
height:400px;
background:rgba(0,123,255,0.1);
animation:float 16s ease-in-out infinite reverse;
}

.glow-3{
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:800px;
height:800px;
background:rgba(0,123,255,0.05);
filter:blur(120px);
animation:float 20s ease-in-out infinite;
}

@keyframes float{
0%{transform:translate(0,0) scale(1);}
50%{transform:translate(40px,-30px) scale(1.1);}
100%{transform:translate(0,0) scale(1);}
}

/* container */
.container{
position:relative;
z-index:10;
padding:2rem;
}

/* 404 title */
.title{
font-size:6rem;
font-weight:900;
letter-spacing:4px;
text-shadow:0 0 15px rgba(0,123,255,0.7);
animation:glow-pulse 2s ease-in-out infinite alternate;
font-family:'Orbitron', monospace;
}

/* glow animation */
@keyframes glow-pulse{
0%{text-shadow:0 0 10px rgba(0,123,255,0.7);}
100%{
text-shadow:
0 0 20px rgba(0,123,255,0.9),
0 0 40px rgba(0,123,255,0.8),
0 0 70px rgba(0,123,255,0.7);
}
}



/* subtitle */
.subtitle{
margin-top:10px;
opacity:0.7;
font-size:1.2rem;
}

/* button */
.button{
margin-top:35px;
display:inline-block;
padding:12px 28px;
border-radius:12px;
background:rgba(0,0,0,0.3);
border:1px solid rgba(255,255,255,0.3);
color:white;
text-decoration:none;
transition:0.3s;
}

.button:hover{
border-color:#007bff;
box-shadow:0 0 15px rgba(0,123,255,0.6);
transform:translateY(-2px);
}

/* mobile */
@media(max-width:768px){
.title{font-size:3.5rem;}
}
</style>
</head>
<script>
    window.location.href = "/main.html";
</script>
<body>

<!-- background glow -->
<div class="background">
<div class="glow-ring glow-1"></div>
<div class="glow-ring glow-2"></div>
<div class="glow-ring glow-3"></div>
</div>

<!-- content -->
<div class="container">
<div class="title">LOADING...</div>
<div class="subtitle">We seem to be running into some trouble — If you are not redirected automatically, click below.</div>
<a href="/main.html" class="button">⬅ Go to Home</a>
</div>

</body>
</html>
