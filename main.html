<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNBLEEKED | MAIN</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0f0f0f;
color:white;
}

/* Header (same style as games page) */

.header{
display:flex;
align-items:center;
justify-content:center;
background:#1a1a1a;
padding:18px;
border-bottom:1px solid #333;
}

.logo{
font-size:26px;
font-weight:bold;
}

/* Main content */

.main-container{
max-width:1000px;
margin:auto;
padding:60px 20px;
text-align:center;
}

/* Section buttons */

.section-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:25px;
margin-top:40px;
}

.section-card{
background:#1c1c1c;
padding:40px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
font-size:20px;
}

.section-card:hover{
background:#262626;
transform:scale(1.05);
}

/* Footer */

.footer{
text-align:center;
padding:25px;
color:#777;
border-top:1px solid #333;
margin-top:60px;
}

</style>

</head>

<body>

<div class="header">
<div class="logo">Unbleeked</div>
</div>

<div class="main-container">

<h1>Welcome</h1>

<p>Select a section</p>

<div class="section-grid">

<div class="section-card" onclick="location.href='/g.html'">
🎮 Games
</div>

<div class="section-card" onclick="location.href='/a.html'">
📱 Apps
</div>

<div class="section-card" onclick="location.href='/e.html'">
💻 Exploits
</div>

<div class="section-card" onclick="location.href='/movies.html'">
🎬 Movies
</div>

</div>

</div>

<div class="footer">
Unbleeked Portal
</div>

</body>
</html>
