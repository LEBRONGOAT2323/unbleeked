<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNBLEEKED | Main</title>

<link id="favicon" rel="icon" type="image/x-icon" href="https://www.google.com/favicon.ico">

<style>


body{
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
margin:0;
padding:0;
background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#111);
background-size:400% 400%;
animation:gradient 15s ease infinite;
color:white;
text-align:center;
min-height:100vh;
overflow-x:hidden;
}

@keyframes gradient{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

h1{
font-size:120px;
margin:60px 0 20px 0;
letter-spacing:10px;
text-transform:uppercase;
font-weight:900;
text-shadow:0 0 10px rgba(0,123,255,0.7);
}

/* GRID (same as games page) */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:30px;
padding:40px;
max-width:1200px;
margin:0 auto;
}

/* CARDS */

.game-card{
cursor:pointer;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
overflow:hidden;
transition:0.4s;
}

.img-container{
width:100%;
height:180px;
background:linear-gradient(45deg,#1e1e2f,#2a2a40);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.img-container::after{
content:"📂";
font-size:50px;
opacity:0.2;
}

.game-card img{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
top:0;
left:0;
}

.game-card:hover{
transform:translateY(-10px);
border-color:#007bff;
box-shadow:0 0 20px rgba(0,123,255,0.6);
}

.game-card p{
padding:15px;
margin:0;
font-weight:600;
background:rgba(0,0,0,0.3);
}

.footer{
text-align:center;
padding:30px;
color:#aaa;
}

  .cursor {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

@keyframes glow-pulse {
0% { text-shadow:0 0 10px rgba(0,123,255,0.7); }

100% { 
text-shadow:
0 0 20px rgba(0,123,255,0.9),
0 0 40px rgba(0,123,255,0.8),
0 0 70px rgba(0,123,255,0.7);
}
}

.title{
animation: glow-pulse 2s ease-in-out infinite alternate;
}

.background{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
pointer-events:none;
}

.glow-1,.glow-2,.glow-3{
position:absolute;
border-radius:50%;
filter:blur(80px);
transition:transform .15s linear;
}

.glow-1{
top:25%;
left:25%;
width:400px;
height:400px;
background:rgba(0,123,255,0.15);
animation:pulseGlow 6s ease-in-out infinite;
}

.glow-2{
bottom:25%;
right:25%;
width:400px;
height:400px;
background:rgba(0,123,255,0.12);
animation:pulseGlow 8s ease-in-out infinite;
}

.glow-3{
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:800px;
height:800px;
background:rgba(0,123,255,0.08);
filter:blur(120px);
animation:pulseGlow 10s ease-in-out infinite;
}

@media (max-width:768px){
h1{
font-size:50px;
letter-spacing:6px;
}
}

@keyframes float{
0%{transform:translate(0,0) scale(1);}
50%{transform:translate(40px,-30px) scale(1.1);}
100%{transform:translate(0,0) scale(1);}
}

@keyframes pulseGlow{
0%{opacity:.3;}
50%{opacity:.6;}
100%{opacity:.3;}
}

.game-card{
transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
}

</style>

</head>

<body>

<div class="background">
<div class="glow-1"></div>
<div class="glow-2"></div>
<div class="glow-3"></div>
</div>



  <h1 class="title" onclick="location.href='/main.html'" style="cursor:pointer;">
                <span id="typewriter"></span><span class="cursor">|</span>
            </h1>

<div class="grid">

<div class="game-card" onclick="location.href='/g.html'">
<div class="img-container">
<img src="/images/games.png" loading="lazy">
</div>
<p>Games</p>
</div>

<div class="game-card" onclick="location.href='/a.html'">
<div class="img-container">
<img src="/images/apps.png" loading="lazy">
</div>
<p>Apps</p>
</div>

<div class="game-card" onclick="location.href='/e.html'">
<div class="img-container">
<img src="/images/exploits.png" loading="lazy">
</div>
<p>Exploits</p>
</div>

<div class="game-card" onclick="location.href='/movies.html'">
<div class="img-container">
<img src="/images/movies.png" loading="lazy">
</div>
<p>Movies</p>
</div>

</div>

<div class="footer">
Unbleeked Portal
</div>

  <script>
        // Typewriter effect
        const typewriter = document.getElementById('typewriter');
        const text = 'UNBLEEKED';
        let i = 0;

        function typeEffect() {
            if (i < text.length) {
                typewriter.textContent += text.charAt(i);
                i++;
                setTimeout(typeEffect, 150);
            }
        }

        // Start typewriter effect when page loads
        window.addEventListener('load', typeEffect);
    </script>
    <script>
const glow1 = document.querySelector(".glow-1");
const glow2 = document.querySelector(".glow-2");
const glow3 = document.querySelector(".glow-3");

document.addEventListener("mousemove", (e) => {
const x = e.clientX / window.innerWidth - 0.5;
const y = e.clientY / window.innerHeight - 0.5;

glow1.style.transform = `translate(${x*40}px, ${y*40}px)`;
glow2.style.transform = `translate(${x*60}px, ${y*60}px)`;
glow3.style.transform = `translate(${x*20}px, ${y*20}px)`;
});
</script>
</body>
</html>
